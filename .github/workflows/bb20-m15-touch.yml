name: Nexus Quant | M15 True BB20 Pullback Research
on:
  push:
    branches: [main]
    paths:
      - 'research/bb20_m15_line_research.py'
      - '.github/workflows/bb20-m15-touch.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-quant-m15-touch-comparison
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare requested touch of M15 Bollinger mean with H1 trend
        run: python -m research.bb20_m15_line_research
      - name: Persist research
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results/bb20_m15_true_touch_comparison_2026-10-26.*
          if ! git diff --cached --quiet; then
            git commit -m 'research: save M15 SMA20-touch H1 trend comparison [skip ci]'
            git pull --rebase
            git push
          fi
