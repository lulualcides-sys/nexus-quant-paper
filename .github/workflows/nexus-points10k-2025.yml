name: Nexus Alpha Points — 2025 independent M15 validation
on:
  push:
    paths:
      - "robots/mt5/nexus_vector_retest/points10k_2025.py"
      - ".github/workflows/nexus-points10k-2025.yml"
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Get immutable public 2025 1m data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Replay fixed M15 strategy and VWAP comparator across 10k blocks
        env:
          EXTERNAL_GOLD_ROOT: thirdparty/gold
        run: python robots/mt5/nexus_vector_retest/points10k_2025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nexus-Alpha-Points-M15-2025-Fixed-Rules
          path: robots/mt5/nexus_vector_retest/points10k_2025_results/
          if-no-files-found: warn
