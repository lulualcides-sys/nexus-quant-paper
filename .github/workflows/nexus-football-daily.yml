name: "NEXUS Futebol | relatório diário Telegram existente"
on:
  schedule:
    # 00h01 Brasilia é a primeira tentativa. 00h21/00h41/01h01 recuperam atrasos.
    # O marcador idempotente evita duplicar mensagem mesmo com execuções atrasadas.
    - cron: "1,21,41 3 * * *"
    - cron: "1 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-quant-paper
  cancel-in-progress: false
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependência de chat criptografado
        run: python -m pip install cryptography
      - name: Testar antes de notificar
        run: python -m unittest discover -s tests -v
      - name: Enviar UMA notificação de futebol no bot já configurado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.nexus_football_daily
      - name: Persistir marcador para não reenviar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/nexus_football_reports/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily NEXUS football Telegram delivered [skip ci]'
            git pull --rebase
            git push
          fi
