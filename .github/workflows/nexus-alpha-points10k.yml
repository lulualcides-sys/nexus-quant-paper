name: Nexus Alpha Points — 10k candles XAUUSD reproducible screen
on:
  push:
    paths:
      - "robots/mt5/nexus_vector_retest/points10k.py"
      - ".github/workflows/nexus-alpha-points10k.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned deps
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Execute all 10k-bar candidate windows
        run: python robots/mt5/nexus_vector_retest/points10k.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nexus-Alpha-Points-XAUUSD-10000-Candles
          path: robots/mt5/nexus_vector_retest/points10k_results/
          if-no-files-found: warn
