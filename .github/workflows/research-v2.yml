name: Research | Select slower strategies
on:
  push:
    branches: [main]
    paths:
      - research/screen_v2.py
      - .github/workflows/research-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-quant-research-v2
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run original unit tests
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tests -v
      - name: Screen candidates on complete H4 candles
        run: python -m research.screen_v2
      - name: Publish ALL strategy outcomes (including losing trials)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/strategy_screen_v2.json research/results/strategy_screen_v2.md
          if ! git diff --cached --quiet; then
            git commit -m 'research: store audited full screen v2 [skip ci]'
            git pull --rebase
            git push
          fi
