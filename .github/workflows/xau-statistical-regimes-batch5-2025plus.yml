name: XAUUSD 2025+ statistical regimes batch5 ONLY M1-M5-M15-M30
on:
  push:
    branches:
      - research/xau-statistical-regimes-batch5-20261112
    paths:
      - 'robots/mt5/nexus_vector_retest/xau_statistical_regimes_batch5_2025plus.py'
      - 'robots/mt5/nexus_vector_retest/test_xau_statistical_regimes_batch5_2025plus.py'
      - '.github/workflows/xau-statistical-regimes-batch5-2025plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Syntax, causal regression and unchanged approved candidates
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/xau_statistical_regimes_batch5_2025plus.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_statistical_regimes_batch5_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_mtf_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_volatility_breakouts_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_indicator_lab_2025plus.py' -v
      - name: Fetch only pinned XAUUSD 2025 data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - name: Simulate statistical mean-reversion and regime models ONLY M1 M5 M15 M30
        run: python -u robots/mt5/nexus_vector_retest/xau_statistical_regimes_batch5_2025plus.py
      - name: Archive all results positive and negative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-statistical-batch5-M1-M5-M15-M30
          path: robots/mt5/nexus_vector_retest/xau_statistical_regimes_batch5_2025plus_results/
          if-no-files-found: warn
