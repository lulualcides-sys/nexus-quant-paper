name: XAUUSD Price Action M1 M5 | Frozen May replication
on:
  push:
    branches: [research/xauusd-price-action-m1m5-20261110]
    paths:
      - research/xau_pa_may_replication.py
      - tests/test_xau_pa_may_replication.py
      - .github/workflows/xau-price-action-may-replication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        block: [first, second]
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unchanged code and study-split regression tests
        run: |
          python -m py_compile research/xau_price_action_m1m5.py research/xau_pa_may_replication.py
          python -m unittest discover -s tests -p 'test_xau_pa_may_replication.py' -v
          python -m unittest discover -s tests -p 'test_xau_price_action_m1m5.py' -v
      - name: Download fixed ten XAUUSD May sessions and replay M1/M5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quotes" "$RUNNER_TEMP/evidence"
          if [[ "${{ matrix.block }}" == "first" ]]; then
            DAYS=(20260504 20260505 20260506 20260507 20260508
                  20260511 20260512 20260513 20260514 20260515)
          else
            DAYS=(20260518 20260519 20260520 20260521 20260522
                  20260525 20260526 20260527 20260528 20260529)
          fi
          for d in "${DAYS[@]}"; do
            date="${d:0:4}-${d:4:2}-${d:6:2}"
            npx --yes dukascopy-node@1.51.1 \
              -i xauusd -from "${date}T12:00Z" -to "${date}T17:00Z" \
              -t tick -f csv -dir "$RUNNER_TEMP/quotes" -fn "xau_${d}" \
              -bs 3 -bp 1500 -r 2
            f="$RUNNER_TEMP/quotes/xau_${d}.csv"
            test -s "$f"
            head -n 1 "$f" | grep -q '^timestamp,askPrice,bidPrice'
            python -m research.xau_price_action_m1m5 \
              --ticks "$f" --day "$d" \
              --output "$RUNNER_TEMP/evidence/xau_pa_${d}.json" \
              --quarantine-output "$RUNNER_TEMP/evidence/quarantine_${d}.json"
            test -f "$RUNNER_TEMP/evidence/xau_pa_${d}.json" -o -f "$RUNNER_TEMP/evidence/quarantine_${d}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xau-pa-may-${{ matrix.block }}-evidence
          path: ${{ runner.temp }}/evidence/*.json
          retention-days: 30
  combined:
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: xau-pa-may-*-evidence
          merge-multiple: true
          path: ${{ runner.temp }}/evidence
      - name: Strict 20-date fixed May M1/M5 rollup
        shell: bash
        run: |
          set -euo pipefail
          python -m research.xau_pa_may_replication \
            --evidence "$RUNNER_TEMP/evidence" \
            --out "$RUNNER_TEMP/summary"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"summary/xau_pa_may_evaluation.json").read_text())
          assert not r["approved_to_trade"]
          assert r["parameters_untouched_since_june"] is True
          assert len(r["valid_dates"])>=16
          for tf in ("M1","M5"):
              a,b,c=(r["results"][tf][s] for s in
                       ("all","may_04_to_15","may_18_to_29"))
              assert a["filled"]<=a["signals"]
              assert a["source_days"]==b["source_days"]+c["source_days"]
              assert abs(a["net_usd_per_oz"]-b["net_usd_per_oz"]-c["net_usd_per_oz"])<.002
              print("FINAL MAY",tf,a)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xau-price-action-may-unoptimized-M1-M5-scorecard
          path: ${{ runner.temp }}/summary/*
          retention-days: 30
