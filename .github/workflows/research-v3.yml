name: Research V3 | Multi-market regime screen
on:
  push:
    branches: [main]
    paths:
      - research/regime_v3.py
      - .github/workflows/research-v3.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-quant-v3
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all unit tests
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tests -v
      - name: Download independent daily series and run 50 candidate comparisons
        run: python -m research.regime_v3
      - name: Publish full research including losing combinations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/regime_research_v3.json research/results/regime_research_v3.md
          if ! git diff --cached --quiet; then
            git commit -m 'research: log v3 complete 50-candidate screen [skip ci]'
            git pull --rebase
            git push
          fi
