name: Nexus Quant | 26 paper bots / Five markets
# Controlled one-off post-merge PAPER scan; no Telegram entry/exit alerts.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/monitor.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '19 */4 * * 1-5' # scan original ten H4 paper bots, weekdays
    - cron: '12 * * * 1-5' # scan 15 H1 experimental bots on five markets, weekdays
    - cron: '5,20,35,50 * * * 1-5' # USD/CAD M15-only scan, weekdays; GitHub timing may lag
    - cron: '30 22 * * 1-5' # fechamento 19:30 America/Sao_Paulo (UTC-3), weekdays
    - cron: '0 23 * * 1-5' # recuperação 20:00; marcador diário impede duplicação
  workflow_dispatch:
    inputs:
      mode:
        description: Scan H4, report Telegram ou M15 isolado
        type: choice
        options: [scan, report, mtf]
        default: scan
permissions:
  contents: write
concurrency:
  group: nexus-quant-monitor
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encrypted-chat dependency
        run: python -m pip install cryptography
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Observe public market prices
        if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'test: run forward monitor scan'))"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          NEXUS_NEWS_GUARD_ENABLED: ${{ vars.NEXUS_NEWS_GUARD_ENABLED || '0' }}
        shell: bash
        run: |
          MODE=scan
          if [[ "$SCHEDULE_EXPR" == '5,20,35,50 * * * 1-5' || "$MANUAL_MODE" == 'mtf' ]]; then MODE=mtf; fi
          if [[ "$SCHEDULE_EXPR" == '30 22 * * 1-5' || "$SCHEDULE_EXPR" == '0 23 * * 1-5' || "$MANUAL_MODE" == 'report' ]]; then MODE=report; fi
          if [[ "$MODE" == 'report' ]]; then
            # Fechamento não deve depender de feed do ouro após o pregão.
            python -m src.scheduled_closing
          else
            python -m src.runner --mode "$MODE"
          fi
      - name: Store signal journal
        if: "success() && github.event_name != 'pull_request' && (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'test: run forward monitor scan'))"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state
          if [[ -d reports ]]; then git add -A reports; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record public observations [skip ci]'
            git pull --rebase
            git push
          fi
