name: Nexus Quant | Five markets
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '19 */4 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '2 * * * *' # hourly opt-in check only, no trading
  workflow_dispatch:
    inputs:
      mode:
        description: Scan (registrar dados) ou report (enviar relatorio)
        type: choice
        options: [scan, report]
        default: scan
permissions:
  contents: write
concurrency:
  group: nexus-quant-paper
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encrypted-chat dependency
        run: python -m pip install cryptography
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Verify Telegram bot
        if: "(github.event_name == 'schedule' && github.event.schedule == '2 * * * *') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'test: verify Nexus Quant Telegram connection'))"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.telegram_check
      - name: Observe public market prices
        if: "github.event_name != 'push' && github.event.schedule != '2 * * * *'"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          MODE=scan
          if [[ "$SCHEDULE_EXPR" == '15 22 * * 1-5' || "$MANUAL_MODE" == 'report' ]]; then MODE=report; fi
          python -m src.runner --mode "$MODE"
      - name: Store signal journal
        if: success() && github.event_name != 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state
          if [[ -d reports ]]; then git add -A reports; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record public observations [skip ci]'
            git pull --rebase
            git push
          fi
