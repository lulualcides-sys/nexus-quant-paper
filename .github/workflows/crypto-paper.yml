name: Nexus Quant CRIPTO | 4 paper bots BTC ETH 24-7
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/crypto-paper.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/crypto-paper.yml'
  schedule:
    - cron: '34 * * * *' # research H1 candle scan, all seven days
    - cron: '27 22 * * *' # daily crypto digest ~19:27 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Scan or send one crypto daily report
        options: [scan, report]
        default: scan
permissions:
  contents: write
concurrency:
  group: nexus-quant-paper
  cancel-in-progress: false
jobs:
  crypto-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same Telegram dependency as financial monitor
        run: python -m pip install cryptography
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Scan paper crypto or send daily-only digest
        if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          MODE=scan
          if [[ "$SCHEDULE_EXPR" == '27 22 * * *' || "$MANUAL_MODE" == 'report' ]]; then MODE=report; fi
          python -m src.crypto_runner --mode "$MODE"
      - name: Persist crypto paper state without touching existing gold bots
        if: "success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/crypto_paper_v1.json 2>/dev/null || true
          git add state/crypto_daily_sent.json 2>/dev/null || true
          if [[ -d reports/crypto ]]; then git add -A reports/crypto; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: crypto paper observations [skip ci]'
            git pull --rebase
            git push
          fi
