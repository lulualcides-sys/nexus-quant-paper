name: Indicator Fusion GOLD V2 - paired paper research
on:
  workflow_dispatch:
  push:
    branches:
      - 'research/indicator-fusion-gold-*'
    paths:
      - 'research/indicator_fusion_v2.py'
      - 'research/run_indicator_fusion_v2.py'
      - 'tests/test_indicator_fusion_v2.py'
      - '.github/workflows/indicator-fusion-v2.yml'

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test V1 and V2 research engines
        run: python -m unittest tests.test_indicator_fusion_bots tests.test_indicator_fusion_v2 -v
      - name: Paired GC=F historical research (no orders)
        run: python -m research.run_indicator_fusion_v2
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicator-fusion-v2-paper
          path: research/results/indicator_fusion_v2_latest.json
          if-no-files-found: warn