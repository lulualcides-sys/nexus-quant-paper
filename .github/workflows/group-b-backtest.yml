name: Research | Group B leveraged annual PnL
on:
  push:
    branches: [main]
    paths:
      - 'research/backtest_group_b.py'
      - '.github/workflows/group-b-backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: group-b-annual-paper-research
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency and run tests
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tests -v
      - name: Run exact Group B rule simulation
        run: python -m research.backtest_group_b
      - name: Save negative and positive results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/group_b_leverage_1y.md research/results/group_b_leverage_1y.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish leverage group B annual PnL [skip ci]'
            git pull --rebase
            git push
          fi
