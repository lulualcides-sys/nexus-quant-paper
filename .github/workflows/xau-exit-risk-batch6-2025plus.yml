name: XAUUSD frozen-entry exit audit batch6 2025+ M1 M5 M15 M30
on:
  push:
    branches:
      - research/xau-exit-risk-audit-batch6-20261112
    paths:
      - 'robots/mt5/nexus_vector_retest/xau_exit_risk_batch6_2025plus.py'
      - 'robots/mt5/nexus_vector_retest/test_xau_exit_risk_batch6_2025plus.py'
      - '.github/workflows/xau-exit-risk-batch6-2025plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Syntax and frozen original code regression tests
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/xau_exit_risk_batch6_2025plus.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_exit_risk_batch6_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_mtf_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_indicator_lab_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_statistical_regimes_batch5_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_volatility_breakouts_2025plus.py' -v
      - name: Fetch ONLY 2025 XAUUSD one-minute pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - name: Replay unchanged entries under exit alternatives, two years and 3 costs
        run: python -u robots/mt5/nexus_vector_retest/xau_exit_risk_batch6_2025plus.py
      - name: Preserve all variants and losing results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-exit-risk-batch6-2025plus-full
          path: robots/mt5/nexus_vector_retest/xau_exit_risk_batch6_2025plus_results/
          if-no-files-found: warn
