name: MetaQuotes free demo research | NO orders | WIN availability
on:
  push:
    branches:
      - research/mt5-free-demo-win-probe-20261110
    paths:
      - research/probe_public_mt5_demo.py
      - research/probe_mt5_native_without_login.py
      - tests/test_mt5_free_demo_probe.py
      - .github/workflows/mt5-free-demo-win-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_guest_web:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check security and guest mode semantics using only fake objects
        shell: pwsh
        run: python -m unittest discover -s tests -p test_mt5_free_demo_probe.py -v
      - name: Install browser reader (no downloaded login accounts)
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input playwright
      - name: Read only OFFICIAL MetaQuotes trial terminal webpage
        shell: pwsh
        run: python -m research.probe_public_mt5_demo
      - name: Store sanitized result, not browser session or credential cookies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaquotes-official-web-demo-no-orders
          path: research/results/mt5_official_guest_demo_probe.json
          retention-days: 7
  official_native_accountless:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official MT5 Python package only
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input MetaTrader5
      - name: Install official MetaTrader5 terminal into isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir=Join-Path $env:RUNNER_TEMP 'MT5NoAccountProbe'
          $url='https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 4 -TimeoutSec 90
          if ((Get-Item $installer).Length -lt 1000000) { throw 'Invalid official MT5 installer' }
          $p=Start-Process -FilePath $installer -ArgumentList @('/auto',"/path:`"$installDir`"") -Wait -PassThru
          Write-Host "Official installer exit code $($p.ExitCode)"
          $deadline=(Get-Date).AddSeconds(110)
          do {
            $terminal=Get-ChildItem -Path $installDir -Filter terminal64.exe -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 1 -ExpandProperty FullName
            if ($terminal) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $terminal) {throw 'Official terminal64.exe not found'}
          "NQ_TERMINAL_EXE=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Official terminal available; NO fake broker credentials'
      - name: Check what a fresh genuine MT5 can read with NO ACCOUNT LOGIN
        shell: pwsh
        run: |
          python -m research.probe_mt5_native_without_login --terminal-exe "$env:NQ_TERMINAL_EXE"
      - name: Upload accountless diagnosis only (no account secrets, no orders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-genuine-terminal-no-account-check
          path: research/results/mt5_native_accountless_probe.json
          retention-days: 7
