name: Research | Gold risk sensitivity
on:
  push:
    branches: [main]
    paths:
      - 'research/gold_risk_sensitivity.py'
      - '.github/workflows/gold-risk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-gold-risk
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tests -v
      - name: Run risk scenarios against real H4 history
        run: python -m research.gold_risk_sensitivity
      - name: Publish full figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/gold_risk_sensitivity.md research/results/gold_risk_sensitivity.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish complete gold risk scenarios [skip ci]'
            git pull --rebase
            git push
          fi
