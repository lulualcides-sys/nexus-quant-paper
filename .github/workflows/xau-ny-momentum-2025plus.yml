name: Nexus XAUUSD NY momentum 2025+ fixed four-model validation
on:
  push:
    branches: [research/xau-ny-momentum-2025plus-20261114]
    paths:
      - 'robots/mt5/nexus_vector_retest/xau_ny_momentum_2025plus.py'
      - 'robots/mt5/nexus_vector_retest/test_xau_ny_momentum_2025plus.py'
      - '.github/workflows/xau-ny-momentum-2025plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen quantitative dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Causal and regression tests
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/xau_ny_momentum_2025plus.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_ny_momentum_2025plus.py' -v
      - name: Retrieve pinned XAUUSD 2025 1min OHLCV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - name: Run fixed 2025 and 2026 partial historical analysis
        run: python -u robots/mt5/nexus_vector_retest/xau_ny_momentum_2025plus.py
      - name: Upload complete results including negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-NY-MOMENTUM-2025-2026
          path: robots/mt5/nexus_vector_retest/xau_ny_momentum_results/
          if-no-files-found: warn
