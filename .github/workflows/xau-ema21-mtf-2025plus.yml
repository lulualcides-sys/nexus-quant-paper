name: XAUUSD EMA21 2025+ all MT5 minute timeframes M1-M30
on:
  push:
    branches:
      - research/xau-ema21-m1-to-m30-2025plus-20261112
    paths:
      - 'robots/mt5/nexus_vector_retest/alpha_xau_mtf_2025plus.py'
      - 'robots/mt5/nexus_vector_retest/test_alpha_xau_mtf_2025plus.py'
      - '.github/workflows/xau-ema21-mtf-2025plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible Python dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Syntax and synthetic regression checks
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/alpha_xau_mtf_2025plus.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_mtf_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_longhold.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_entry_risk_2025plus.py' -v
      - name: Download pinned 2025 XAUUSD data ONLY (2026 source SHA-checked by script)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - name: Replay all 11 MT5 minute timeframes 2025-2026
        run: python -u robots/mt5/nexus_vector_retest/alpha_xau_mtf_2025plus.py
      - name: Upload research report and machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-EMA21-M1-M30-2025plus
          path: robots/mt5/nexus_vector_retest/alpha_xau_mtf_2025plus_results/
          if-no-files-found: warn
