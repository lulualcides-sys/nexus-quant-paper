name: ALPHA V7 breakout quality — isolated external-market check
on:
  pull_request:
    branches:
      - research/alpha-v6-continuous-protect-20261108
    paths:
      - 'research/alpha_v6/data.py'
      - 'research/alpha_v7/**'
      - 'tests/test_alpha_v7.py'
      - '.github/workflows/alpha-v7-breakout-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Causal quality gate + prior engine regressions
        run: |
          python -m unittest discover -s tests -p 'test_alpha_v7.py' -v
          python -m unittest discover -s tests -p 'test_alpha_v6.py' -v
          python -m unittest discover -s tests -p 'test_alpha_lab.py' -v
  replay:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare unchanged V5 entries with V7 quality over 88 verified Binance SPOT month ZIPs
        run: python -m research.alpha_v7.run --out artifacts/alpha-v7
      - name: Preserve all source hashes, veto diagnostics and raw trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-v7-quality-${{ github.run_id }}
          path: artifacts/alpha-v7
          retention-days: 30
          if-no-files-found: warn
