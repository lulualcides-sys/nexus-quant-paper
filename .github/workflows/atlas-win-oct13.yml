name: ATLAS October evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify evidence importer and never invent trades
        run: python -m unittest discover -s tests -p 'test_atlas_win_oct13.py' -v
