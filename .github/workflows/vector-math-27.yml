name: Nexus Quant | vetor matematico dos 27
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/vector_math_27.py'
      - 'tests/test_vector_math_27.py'
      - 'research/results/backtest_27_2026-11-01.json'
      - '.github/workflows/vector-math-27.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-quant-vector-math-27
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline 27-robot vector tests
        run: python -m unittest discover -s tests -p 'test_vector_math_27.py' -v
      - name: Compute 19-step vector from pinned verified historical snapshot
        run: python -m research.vector_math_27
      - name: Archive reproducible mathematical audit
        uses: actions/upload-artifact@v4
        with:
          name: nexus-27-math-vectors
          path: |
            research/results/vector_math_27_2026-11-01.json
            research/results/vector_math_27_2026-11-01.md
          retention-days: 30
          if-no-files-found: error
