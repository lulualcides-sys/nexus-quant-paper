name: "NEXUS QUANT V2 | cost-aware six-robot backtests"
on:
  pull_request:
    branches: [main]
    paths:
      - "research/nexus_m1m5/**"
      - "tests/test_nexus_m1m5_v2.py"
      - "docs/NEXUS-M1M5-V2-COST-AWARE.md"
      - ".github/workflows/nexus-m1m5-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-m1m5-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: V2 no-lookahead and risk tests
        run: python -m unittest discover -s tests -p "test_nexus_m1m5_v2.py" -v
      - name: V1 compatibility tests
        run: python -m unittest discover -s tests -p "test_nexus_m1m5_lab.py" -v
      - name: Compile all research files
        run: python -m compileall -q research/nexus_m1m5 tests/test_nexus_m1m5_v2.py
  research-2025-2026:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache verified monthly Binance archives
        uses: actions/cache@v4
        with:
          path: .cache/nexus_m1m5_v2/
          key: binance-spot-m1m5-v2-frozen-2025-01-2026-06-v1
      - name: Download SHA256 verified OHLCV and replay 18 months
        run: python -m research.nexus_m1m5.v2_run --out artifacts/nexus-m1m5-v2
      - name: Export all trades and source manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-m1m5-v2-research-${{ github.run_id }}
          path: artifacts/nexus-m1m5-v2/
          if-no-files-found: warn
          retention-days: 30
