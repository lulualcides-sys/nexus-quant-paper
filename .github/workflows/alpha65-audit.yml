name: ALPHA65 - audit independent XAUUSD strategies and realistic-proxy replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/alpha65/**'
      - '.github/workflows/alpha65-audit.yml'
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Multi-strategy XAUUSD candidate research
        run: python research/alpha65/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha65-Audit-XAUUSD-Replay
          path: research/alpha65/results/
          if-no-files-found: warn
