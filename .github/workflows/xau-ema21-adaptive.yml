name: XAUUSD EMA21 adaptive trend-gated exit research
on:
  push:
    branches:
      - research/xau-ema21-adaptive-trend-exit-20261112
    paths:
      - 'robots/mt5/nexus_vector_retest/alpha_xau_adaptive.py'
      - 'robots/mt5/nexus_vector_retest/test_alpha_xau_adaptive.py'
      - '.github/workflows/xau-ema21-adaptive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Syntax and synthetic regression tests
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/alpha_xau_adaptive.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_longhold.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_alpha_xau_adaptive.py' -v
      - name: Fetch 2024 holdout and 2025 previously seen data pinned at a fixed git commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2024 XAUUSD/1m/2025
      - name: XAUUSD M15 historical fixed comparison, including unused 2024 holdout
        run: python robots/mt5/nexus_vector_retest/alpha_xau_adaptive.py
      - name: Always upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-EMA21-AdaptiveTrend-2024-2026
          path: robots/mt5/nexus_vector_retest/alpha_xau_adaptive_results/
          if-no-files-found: warn
