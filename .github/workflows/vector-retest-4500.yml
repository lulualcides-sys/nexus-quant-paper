name: XAUUSD 4500 candles por timeframe - Vector Retest
on:
  workflow_dispatch:
  push:
    paths:
      - 'robots/mt5/nexus_vector_retest/research_4500/**'
      - '.github/workflows/vector-retest-4500.yml'
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analytical dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.3.3 pyarrow==20.0.0
      - name: Verify exact historical sources and execute five timeframes
        run: python robots/mt5/nexus_vector_retest/research_4500/run_4500.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XAUUSD-4500-candles-M1-M5-M15-M30-H1
          path: robots/mt5/nexus_vector_retest/research_4500/results/
          if-no-files-found: warn
