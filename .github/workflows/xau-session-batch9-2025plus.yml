name: XAUUSD batch9 session structure research 2025plus
on:
  push:
    branches:
      - research/xau-session-flow-batch9-20261112
    paths:
      - 'robots/mt5/nexus_vector_retest/xau_session_batch9_2025plus.py'
      - 'robots/mt5/nexus_vector_retest/test_xau_session_batch9_2025plus.py'
      - '.github/workflows/xau-session-batch9-2025plus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 pandas==2.3.3
      - name: Compile and causal regression test
        run: |
          python -m py_compile robots/mt5/nexus_vector_retest/xau_session_batch9_2025plus.py
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_session_batch9_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_independent_batch8_2025plus.py' -v
          python -m unittest discover -s robots/mt5/nexus_vector_retest -p 'test_xau_exit_risk_batch6_2025plus.py' -v
      - name: Fetch 2025 XAUUSD from pinned historical source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/parshant65-lang/Gold-XAUUSD-1m-2020-2025-Historical-Data.git thirdparty/gold
          git -C thirdparty/gold checkout --quiet b2cfdc571ffac9eff9f2132ea6946da559d29af2
          git -C thirdparty/gold sparse-checkout set XAUUSD/1m/2025
      - name: Backtest four new models on four native TFs with two frozen controls
        run: python -u robots/mt5/nexus_vector_retest/xau_session_batch9_2025plus.py
      - name: Preserve every positive and negative research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-session-batch9-full
          path: robots/mt5/nexus_vector_retest/xau_session_batch9_results/
          if-no-files-found: warn
