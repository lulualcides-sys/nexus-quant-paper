name: XAUUSD | TODOS 27 originais + ATLAS em M1 M5 M15
on:
  push:
    branches: [research/xau-all-original-28-m1-m5-m15-20261110]
    paths:
      - research/xau_all_original_3tf.py
      - src/experimental_h1.py
      - tests/test_xau_all_original_3tf.py
      - .github/workflows/xau-all-28-originals-m1-m5-m15.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-rule-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-test same 27+1 robot identities and research-only TF adapter
        run: |
          python -m py_compile research/xau_all_original_3tf.py src/experimental_h1.py
          python -m unittest discover -s tests -p 'test_xau_all_original_3tf.py' -v
          python -m unittest discover -s tests -p 'test_experimental_h1.py' -v
          python -m unittest discover -s tests -p 'test_backtest_27.py' -v
          python -m unittest discover -s tests -p 'test_gold_forward.py' -v
          python -m unittest discover -s tests -p 'test_leveraged_cohort.py' -v
          python -m unittest discover -s tests -p 'test_momentum60_shadow.py' -v
          python -m unittest discover -s tests -p 'test_bb_rebound_mtf.py' -v
          python -m unittest discover -s tests -p 'test_atlas_vector.py' -v
  historical-28-x-3-timeframes:
    needs: original-rule-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore 25 predeclared daily fingerprints from previous evidence
        uses: actions/download-artifact@v4
        with:
          name: XAU-all-original-27-plus-ATLAS-M1-M5-M15-84-scorecards
          run-id: 42846083666
          repository: lulualcides-sys/nexus-quant-paper
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}
      - name: Download only previously quarantined gold sessions, reuse verified source days
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xau-quote" "$RUNNER_TEMP/xau-candles" "$RUNNER_TEMP/xau-score"
          DAYS=(20261005 20261006 20261007 20261008 20261009
                20261012 20261013 20261014 20261015 20261016
                20261019 20261020 20261021 20261022 20261023
                20261026 20261027 20261028 20261029 20261030
                20261102 20261103 20261104 20261105 20261106)
          for d in "${DAYS[@]}"; do
            previous="$RUNNER_TEMP/xau-candles/${d}.json"
            if test -s "$previous" && grep -q '"quarantined":false' "$previous"; then
              echo "FROZEN_DAY_REUSED ${d} already validated with source SHA256"
              continue
            fi
            date="${d:0:4}-${d:4:2}-${d:6:2}"
            f="$RUNNER_TEMP/xau-quote/xau_${d}.csv"
            if ! npx --yes dukascopy-node@1.51.1 \
              -i xauusd -from "${date}T12:00Z" -to "${date}T23:00Z" \
              -t tick -f csv -dir "$RUNNER_TEMP/xau-quote" \
              -fn "xau_${d}" -bs 3 -bp 1500 -r 2; then
              echo "SOURCE_FAILED ${d}: a complete day is quarantined, not synthesized"
            fi
            if test -s "$f"; then
              python -m research.xau_all_original_3tf \
                --quotes "$f" --day "$d" \
                --out "$RUNNER_TEMP/xau-candles/${d}.json"
            else
              printf '{"day":"%s","quarantined":true,"reason":"source_unavailable"}\n' "$d" \
                > "$RUNNER_TEMP/xau-candles/${d}.json"
            fi
            rm -f "$f"
          done
      - name: Run same 28 original slots on each of gold M1 M5 M15 and 2x fees
        shell: bash
        run: |
          set -euo pipefail
          python -m research.xau_all_original_3tf \
            --reports "$RUNNER_TEMP/xau-candles" \
            --out "$RUNNER_TEMP/xau-score/27-originals-plus-atlas-xau-M1-M5-M15.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'xau-score'/'27-originals-plus-atlas-xau-M1-M5-M15.json'
          data=json.loads(p.read_text())
          assert set(data['timeframes'])=={'M1','M5','M15'}
          assert len(data['predeclared_dates'])==25
          for tf,payload in data['timeframes'].items():
              assert payload['robot_slots']==28 and len(payload['books'])==28
              for key,record in payload['books'].items():
                  assert record['closed']>=0
                  print('RESULT',tf,key,record['net_usd'],record['double_cost_net_usd'],record['closed'])
          PY
      - name: Upload actual price provenance, all 84 bot results and caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAU-all-original-27-plus-ATLAS-M1-M5-M15-84-scorecards
          path: |
            ${{ runner.temp }}/xau-score/*.json
            ${{ runner.temp }}/xau-score/*.md
            ${{ runner.temp }}/xau-candles/*.json
          retention-days: 30
          if-no-files-found: warn
